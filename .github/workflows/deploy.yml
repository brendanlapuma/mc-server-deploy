name: Deploy Minecraft server

on:
  workflow_dispatch:
    inputs:
      ram:
        description: Maximum RAM allocated to Minecraft
        required: true
        default: 4G
        type: choice
        options:
          - 2G
          - 4G
          - 6G
          - 8G
          - 16G

permissions:
  contents: read

concurrency:
  group: minecraft-server
  cancel-in-progress: false

env:
  MC_VM_PORT: "22"
  MC_SERVER_DIR: "minecraft-server"
  MC_TMUX_SESSION: "minecraft"
  MC_READY_PATTERN: 'Done \([0-9]+(\.[0-9]+)?s\)! For help, type "help"'
  MC_SHUTDOWN_TIMEOUT: "60"
  MC_STARTUP_TIMEOUT: "300"
  MC_RAM: ${{ inputs.ram || '4G' }}
  MC_STAGING_ARCHIVE: ".minecraft-deploy.tar"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          MC_VM_HOST: ${{ secrets.MC_VM_HOST }}
          MC_VM_USER: ${{ secrets.MC_VM_USER }}
          MC_VM_SSH_KEY: ${{ secrets.MC_VM_SSH_KEY }}
        run: |
          bash .github/scripts/configure-ssh.sh

      - name: Upload repository
        run: |
          set -euo pipefail
          printf -v staging_archive '%q' "$MC_STAGING_ARCHIVE"
          git archive --format=tar "$GITHUB_SHA" |
            ssh -i "$HOME/.ssh/minecraft_deploy" -p "$MC_VM_PORT" "$MC_VM_USER@$MC_VM_HOST" \
              "cat > \$HOME/$staging_archive"

      - name: Stop server
        run: bash .github/scripts/stop-server.sh

      - name: Replace server files
        run: |
          set -euo pipefail
          remote_command="server_dir=\"\$HOME/$(printf '%q' "$MC_SERVER_DIR")\""
          remote_command+=" staging_archive=\"\$HOME/$(printf '%q' "$MC_STAGING_ARCHIVE")\""
          remote_command+=' mkdir -p "$server_dir"'
          remote_command+=' find "$server_dir" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +'
          remote_command+=' tar -xf "$staging_archive" -C "$server_dir"'
          remote_command+=' rm -f "$staging_archive"'
          ssh -i "$HOME/.ssh/minecraft_deploy" -p "$MC_VM_PORT" \
            "$MC_VM_USER@$MC_VM_HOST" "$remote_command"

      - name: Start server and wait for readiness
        run: bash .github/scripts/run-server.sh
