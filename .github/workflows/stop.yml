name: Stop Minecraft server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-server
  cancel-in-progress: false

env:
  MC_VM_PORT: "22"
  MC_SERVER_DIR: "minecraft-server"
  MC_TMUX_SESSION: "minecraft"
  MC_SHUTDOWN_TIMEOUT: "60"

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          MC_VM_HOST: ${{ secrets.MC_VM_HOST }}
          MC_VM_USER: ${{ secrets.MC_VM_USER }}
          MC_VM_SSH_KEY: ${{ secrets.MC_VM_SSH_KEY }}
        run: |
          bash .github/scripts/configure-ssh.sh

      - name: Stop server
        run: |
          set -euo pipefail
          printf -v session '%q' "$MC_TMUX_SESSION"
          printf -v timeout '%q' "$MC_SHUTDOWN_TIMEOUT"
          ssh -i "$HOME/.ssh/minecraft_deploy" -p "$MC_VM_PORT" \
            "$MC_VM_USER@$MC_VM_HOST" \
            "MC_TMUX_SESSION=$session MC_SHUTDOWN_TIMEOUT=$timeout bash -s" \
            < .github/scripts/stop-server.sh
